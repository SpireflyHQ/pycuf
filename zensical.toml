# Documentation site configuration for Zensical (https://zensical.org/docs/setup/basics/).
# Build:   uv run --group docs zensical build --strict --clean   (output: site/, git-ignored)
# Preview: uv run --group docs zensical serve
# docs/reference/codes.md, tables.md and glossary.md are generated by scripts/gen_docs.py.

[project]
site_name = "pycuf"
site_description = "Read, check and analyse CUF-XML, the Dutch exchange format for construction cost estimates, in Python."
site_author = "Ben van der Burgh"
site_url = "https://spireflyhq.github.io/pycuf/"
repo_url = "https://github.com/SpireflyHQ/pycuf"
repo_name = "SpireflyHQ/pycuf"
edit_uri = "edit/main/docs/"
copyright = "© 2026 Ben van der Burgh · MIT licence · not affiliated with Ketenstandaard Bouw en Techniek or Forum Systeemhuizen Bouw"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "User guide" = [
    "guide/reading.md",
    "guide/calculation.md",
    "guide/validation.md",
    "guide/interop.md",
  ] },
  { "How-to" = [
    "how-to/anonymise-a-sample.md",
  ] },
  { "Background" = [
    "guide/format.md",
  ] },
  { "Reference" = [
    "reference/api.md",
    "reference/cli.md",
    "reference/codes.md",
    "reference/tables.md",
    "reference/glossary.md",
  ] },
  { "Project" = [
    "security.md",
    "versioning.md",
    "contributing.md",
    "changelog.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Light/dark palette: follow the system preference, with a manual toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Search is built in and enabled by default (https://zensical.org/docs/setup/search/).

# API reference from the docstrings (Google style), read statically by griffe from src/.
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = ["scripts/griffe_rst.py:RstToMarkdown"]
docstring_section_style = "table"
filters = ["!^_"]
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
show_root_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_if_no_docstring = false

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.snippets = { base_path = ["."], check_paths = true }
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
