name: Bug report
description: pycuf crashes, gives a wrong result, or reports a wrong finding.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Never upload, attach or paste a real CUF file** (also not zipped or "just a part"). Estimates contain
        > client names and addresses and commercially sensitive prices. Issues are public and cannot be fully
        > deleted.
        >
        > Share version information, finding codes and a small **hand-made or anonymised** snippet instead.
        > See [CONTRIBUTING.md](https://github.com/SpireflyHQ/pycuf/blob/main/CONTRIBUTING.md#contributing-anonymised-samples).
        > Security problems go to [private vulnerability reporting](https://github.com/SpireflyHQ/pycuf/security/advisories/new).
  - type: checkboxes
    id: no-real-data
    attributes:
      label: Data protection
      options:
        - label: This issue contains **no real client or company data** (no real CUF file, names, addresses or prices).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: |
        Python code or CLI command, plus the smallest **hand-made or anonymised** XML snippet that shows the problem.
        Keep the encoding/namespace details that matter, replace all names, codes and amounts with fictitious ones.
      render: python
  - type: textarea
    id: output
    attributes:
      label: Traceback, output or finding codes
      description: Full traceback, or the finding codes (`CUF<nnnn>`) and messages pycuf reported. Check them for real data first.
      render: text
  - type: input
    id: pycuf-version
    attributes:
      label: pycuf version
      description: "`python -c \"import pycuf; print(pycuf.__version__)\"`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version and operating system
      placeholder: "3.13.7 on Windows 11"
    validations:
      required: true
  - type: input
    id: exporting-software
    attributes:
      label: Exporting software
      description: Estimating package (and version) that wrote the file, if known (`SYSTEEMHUIS`).
      placeholder: "e.g. Ibis Calculeren, Kraan, Bakker & Spees CIVIEL, Matrix, easy2calc, 2Jours, …"
  - type: input
    id: extras
    attributes:
      label: Installed extras
      placeholder: "none / arrow / polars / all …"
