name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this workflow on the tagged commit before publishing anything.
  workflow_call:

permissions: {}

concurrency:
  # A literal prefix: in a called workflow github.workflow is the caller's name, so it would
  # share (and cancel) the release workflow's group.
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  # Fail instead of silently re-locking when uv.lock is out of date with pyproject.toml.
  UV_LOCKED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: ruff check
        run: uv run --only-group lint ruff check --output-format=github
      - name: ruff format --check
        run: uv run --only-group lint ruff format --check --diff

  typing:
    name: Typing (mypy, pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.11"
      - name: Install (all extras, so optional imports type-check)
        run: uv sync --all-extras
      - name: mypy --strict
        run: uv run --all-extras mypy
      - name: pyright --verifytypes (public API completeness)
        run: uv run --all-extras pyright --verifytypes pycuf --ignoreexternal
      - name: ty (preview, non-blocking)
        continue-on-error: true
        run: uvx --python 3.11 ty@0.0.84 check src/pycuf

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: ${{ matrix.python }}
      - name: pytest (all extras)
        run: uv run --all-extras pytest --cov --cov-report=term

  no-extras:
    # Proves the core wheel installs and works with zero third-party runtime packages.
    name: Core without extras (wheel, 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.11"
      - name: Build the wheel
        run: uv build --wheel --no-sources --out-dir dist
      - name: Install the wheel into a fresh, empty venv
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/core"
          uv pip install --python "$RUNNER_TEMP/core" dist/*.whl
          echo "Installed packages:"
          uv pip list --python "$RUNNER_TEMP/core"
      - name: Import smoke test (no third-party packages present)
        run: |
          "$RUNNER_TEMP/core/bin/python" -I - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import sys

          dists = sorted(d.metadata["Name"].lower() for d in md.distributions())
          assert dists == ["pycuf"], f"unexpected distributions: {dists}"
          for extra in ("nanoarrow", "polars", "pandas", "pyarrow", "typer", "click", "rich"):
              assert importlib.util.find_spec(extra) is None, f"{extra} must not be installed"

          import pycuf
          from pycuf import read, validate  # noqa: F401

          assert "site-packages" in pycuf.__file__, pycuf.__file__
          print("pycuf", pycuf.__version__, "imported from", pycuf.__file__, "on", sys.version)
          PY
      - name: CLI without the 'cli' extra prints the install hint (exit code 3)
        run: |
          set +e
          "$RUNNER_TEMP/core/bin/pycuf" --help 2> "$RUNNER_TEMP/cli.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cli.err"
          test "$code" -eq 3
          grep -q "pycuf\[cli\]" "$RUNNER_TEMP/cli.err"
      - name: Add only the test tools (pytest, hypothesis) to the venv
        run: |
          uv export --only-group test --no-emit-project --format requirements.txt \
            --output-file "$RUNNER_TEMP/test-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/core" -r "$RUNNER_TEMP/test-requirements.txt"
      - name: pytest -m "not extras" against the installed wheel
        run: '"$RUNNER_TEMP/core/bin/python" -m pytest -m "not extras" -p no:cacheprovider'

  sdist:
    # Downstream packagers run the suite from the sdist; it must carry everything the tests read.
    name: Tests from the extracted sdist (3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.14"
      - name: Build the sdist
        run: uv build --sdist --no-sources --out-dir dist
      - name: Install it (all extras) and the test tools into a fresh venv
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/sdist-venv"
          uv export --only-group test --only-group interop --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/test-requirements.txt"
          sdist="$(ls dist/*.tar.gz)"
          uv pip install --python "$RUNNER_TEMP/sdist-venv" "pycuf[all] @ file://$PWD/$sdist" \
            -r "$RUNNER_TEMP/test-requirements.txt"
          mkdir "$RUNNER_TEMP/sdist" && tar -xzf "$sdist" -C "$RUNNER_TEMP/sdist" --strip-components=1
      - name: pytest inside the extracted sdist (no checkout files)
        working-directory: ${{ runner.temp }}/sdist
        run: '"$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -p no:cacheprovider'

  lowest:
    # The declared minimum versions of the extras must install and pass the suite.
    name: Lowest declared versions (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.11"
      - name: Install the lowest versions of pycuf's own dependencies
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/lowest"
          uv export --only-group test --only-group interop --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/test-requirements.txt"
          # pandas 2.2.0 and pyarrow 17 predate NumPy 2 support (a constraint, not a direct
          # requirement, so the lowest-direct resolution does not pick NumPy's oldest release).
          echo "numpy<2" > "$RUNNER_TEMP/constraints.txt"
          uv pip install --python "$RUNNER_TEMP/lowest" --resolution lowest-direct ".[all]" \
            -r "$RUNNER_TEMP/test-requirements.txt" -c "$RUNNER_TEMP/constraints.txt"
          uv pip list --python "$RUNNER_TEMP/lowest"
      - name: pytest against the installed package
        run: '"$RUNNER_TEMP/lowest/bin/python" -m pytest -p no:cacheprovider'

  generated:
    # The reference pages and sample files are generated; fail when they are stale.
    name: Generated files up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Regenerate the reference pages
        run: uv run --no-default-groups python scripts/gen_docs.py
      - name: Regenerate the sample files
        run: uv run --no-default-groups python scripts/gen_examples.py
      - name: Fail on differences
        run: |
          git add --intent-to-add --all
          git diff --exit-code --stat -- docs/reference examples

  experimental:
    name: Experimental (${{ matrix.python }}, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.14t = free-threaded build. Extras (pyarrow, polars, …) may lack wheels here, so only the
        # core test suite runs.
        python: ["3.14t", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache when releasing a tag (cache-poisoning hardening, as in release.yml).
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: ${{ matrix.python }}
      - name: pytest (core only)
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          # Only free-threaded builds accept PYTHON_GIL=0; regular builds abort on it.
          if [[ "$PYTHON" == *t ]]; then export PYTHON_GIL=0; fi
          uv run --no-default-groups --group test pytest -m "not extras"


  ci-ok:
    # Single required status check for branch protection.
    name: CI OK
    if: always()
    needs: [lint, typing, tests, no-extras, sdist, lowest, generated]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
